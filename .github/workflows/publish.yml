name: Publish SDK (Manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the already-pushed v1.0.2 tag
        required: false
        default: false
        type: boolean
      version:
        description: Type 1.0.2 to confirm the package version
        required: true
        type: string

jobs:
  publish:
    if: ${{ github.ref == 'refs/tags/v1.0.2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Publish @coreax/sdk
        if: ${{ github.event.inputs.publish == 'true' && github.event.inputs.version == '1.0.2' }}
        env:
          COREAX_PUBLISH_APPROVED: "1"
          COREAX_PUBLISH_PACKAGE: "@coreax/sdk"
          COREAX_PUBLISH_VERSION: "1.0.2"
        run: npm publish --provenance --access public
