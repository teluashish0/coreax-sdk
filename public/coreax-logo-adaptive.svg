<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474 558" role="img" aria-labelledby="coreax-logo-title">
  <title id="coreax-logo-title">CoreAX logo</title>
  <style>
    .coreax-logo { fill: #000; }
    .coreax-outline-color { flood-color: #fff; }
    @media (prefers-color-scheme: dark) {
      .coreax-logo { fill: #fff; }
      .coreax-outline-color { flood-color: #000; }
    }
  </style>
  <defs>
    <mask id="coreax-mark" x="0" y="0" width="474" height="558" maskUnits="userSpaceOnUse" style="mask-type: alpha">
      <image width="474" height="558" href="data:image/png;base64,"/>
    </mask>
    <filter id="coreax-outline" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="12" result="expanded"/>
      <feFlood class="coreax-outline-color" result="outline-color"/>
      <feComposite in="outline-color" in2="expanded" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#coreax-outline)">
    <rect width="474" height="558" mask="url(#coreax-mark)"/>
  </g>
  <rect class="coreax-logo" width="474" height="558" mask="url(#coreax-mark)"/>
</svg>
